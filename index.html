<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Smart Calculator</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">

</head>
<body>

    <main class="calculator-container">
         <header class="top-bar">
            <!-- Theme Switcher -->
            <label class="theme-switch" title="Toggle Theme">
                <input type="checkbox" id="theme-toggle" checked>
                <span class="slider">
                    <i class="fas fa-sun icon-sun"></i>
                    <i class="fas fa-moon icon-moon"></i>
                </span>
            </label>

            <!-- History Button with Hover Tooltip -->
            <div class="history-wrapper">
                <button id="history-btn" class="icon-btn" aria-label="View History">
                    <i class="fas fa-history"></i>
                </button>

                <!-- Quick Hover Tooltip preview -->
                <div class="history-tooltip" id="history-tooltip">
                    <div class="tooltip-header">Recent History</div>
                    <ul class="tooltip-list" id="tooltip-list">
                        <li class="empty-msg">No recent history</li>
                    </ul>
                </div>
            </div>
         </header>


    </main>














    <!--The script tagas-->
<script src="assets/js/app.js"></script>
<script src="assets/js/Calculator.js"></script>
<script src="assets/js/HistoryManager.js"></script>
<script src="assets/js/ThemeManager.js"></script>
</body>
</html>
